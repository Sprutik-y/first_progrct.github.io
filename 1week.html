<!DOCTYPE html>
<html>
    <head>
        <title>Психологический тест</title>
    </head>
    <body>
        <center>
        <h1>Какой вы сыночка-корзиночка</h1>
        <h3>Психологический тест</h3>
        <p>Ответьте на вопросы цифрой от 0 до 9</p>     
        <button onclick="test()">НАЧАТЬ ТЕСТ</button>    
        </center>
        <script>
            function test(){
                //вопросы
                let q1 = parseFloat(prompt("Вопрос 1 (0-точно ДА, 9-определенно НЕТ):\n\nВы имеете отношение к острову Эпштейна?"));
                let q2 = parseFloat(prompt("Вопрос 2 (0-ГУД, 9-все катится к черту):\n\nКак у тебя дела?"));
                let q3 = parseFloat(prompt("Вопрос 3 (0-точно ДА, 9-определенно НЕТ):\n\nЛюбишь ли ты переслушивать SHAMANA?"));
                let q4 = parseFloat(prompt("Вопрос 4 (0-9):\n\nСколько у тебя извилин в мозгу"));
                let q5 = parseFloat(prompt("Вопрос 5 (0-9):\n\nЛюбимая цифра"));
                
                //сумма результата
                let sum = q1 + q2 + q3 + q4 + q5;

                // определение результат 
                let res = "";

                if (sum >= 0 && sum <= 9) {
                    res = "Ты - банан";
                }
                else if (sum >= 10 && sum <= 18) {
                    res = "Ты - сын Дональда Трампа";
                }
                else if (sum >= 19 && sum <= 27) {
                    res = "Ты - Круассановый Сын";
                }
                else if (sum >= 28 && sum <= 36) {
                    res = "Ты - Илон Маск";
                }
                else if (sum >= 37 && sum <= 45) {
                    res = "Ты - СЫНОЧКА-КОРЗИНОЧКА МАКСИМУС";
                }
                else {
                    res = "Ошибка";
                }

                //вывод результата
                alert("Твой результат: " + sum + " баллов\n\n" + res)
            }
        </script>
    </body>
</html>
